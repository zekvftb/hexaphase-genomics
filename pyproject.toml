[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-arch"
version = "0.1.0"
description = "Biology as Information Architecture: examining biological systems through computational lenses"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Biology as Information Architecture Contributors" }
]
license = { text = "MIT" }
keywords = ["biology", "information-theory", "bioinformatics", "systems-biology", "network-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
analysis = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
]
viz = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
